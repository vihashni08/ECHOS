# ECHOS v2 configuration. Method and numbers: docs/METHOD.md.
seed: 42
paths:
  tihm: data/tihm/Dataset
  models: models
  metrics: reports/metrics
splits:
  n_folds: 5                # patient-level GroupKFold (echos/data/splits.py)
db_path: data/echos.db
runtime:                    # every agent process (echos/team/agent_base.py)
  heartbeat_s: 5
  checkpoint_s: 60
  poll_s: 0.2
  batch: 50
supervisor:                 # echos/orchestrator/supervisor.py
  missed_heartbeats: 3
  stall_s: 30               # cursor unchanged this long while events are pending -> restart
  poll_s: 1.0
alerts:   # URGENT alerts: fixed template, structured data only, no model; see echos/alerts/
  send_real: false          # false -> DryRunMailer: outbox rows only, SMTP is never used
  max_attempts: 3
  backoff_s: [1, 2, 4]
  retry_window_s: 900       # PENDING -> RETRYING with backoff 1, 2, 4, 8 ... capped at backoff_cap_s until this window (from queueing) ends -> FAILED
  backoff_cap_s: 60
  sweep_interval_s: 300     # a background sweeper retries FAILED alert rows this often ...
  sweep_window_s: 7200      # ... for this long after queueing (POST /api/outbox/{id}/retry resends one row on demand)
  ack_link_ttl_s: 86400     # the "I have seen this" link in alert e-mails (needs ECHOS_LINK_SECRET and ECHOS_PUBLIC_URL; otherwise no link)
  critical_cooldown_sim_h: 12   # per patient: a second red-flag alert inside this many SIMULATED hours is suppressed
api:   # echos/api (FastAPI): bound to 127.0.0.1, CORS for the local UI only
  host: 127.0.0.1
  port: 8000
  cors_origin: http://localhost:5173
  allow_kill: false      # POST /api/agents/{name}/kill is refused unless true (scripts/run_api.sh --demo turns it on)
  auth: {enabled: false} # true (or ECHOS_AUTH=on): bearer tokens from ECHOS_TOKEN_CAREGIVER / _CLINICIAN / _OPERATOR; roles caregiver < clinician < operator
coordinator:   # alert lifecycle inside the Care agent (echos/team/coordinator.py). Wall-clock seconds.
  poll_s: 1.0
  ack_timeout_s: {CRITICAL_VITALS: 1800}   # not acknowledged this long after SENT -> ESCALATED (second contact)
  stale_after_s: 21600                     # an unacknowledged alert older than this is EXPIRED, never escalated (history after a restart)
  bus_keep_s: 2592000                      # handled agent messages older than this (30 days) are deleted, once an hour
  prune_every_s: 3600
monitor:   # ECHOS v2 core (echos/monitor/): personal Bayesian episode tracker + agitation detector. Equations: docs/METHOD.md
  min_bp_days: 14            # inclusion: a personal baseline needs history (fixed before any result was seen)
  baseline_window_days: 28   # personal NIG model uses the last 28 reading-days (past only)
  horizon_days: 3            # vitals target: a BP / pulse event on days t+1..t+3, from data up to day t
  alert_budget_per_patient_week: 1.0
  urgent:                    # URGENT = immediate email to caregiver + clinician, no model involved. Red flags only:
    sys_low: 90              #   NEWS2 single-parameter red score (RCP 2017): systolic <= 90, pulse <= 40 or >= 131, temperature <= 35.0
    sys_high: 180            #   NICE NG136: blood pressure >= 180/120 (severe hypertension)
    dia_high: 120
    hr_low: 40
    hr_high: 131
    temp_low: 35.0
    temp_high: 39.1          #   NEWS2 temperature >= 39.1
  attention:                 # TIHM's own daily-check limits (Palermo et al. 2023, Table 5): shown as attention flags in the review reasons
    sys_low: 80
    sys_high: 190
    dia_low: 50
    dia_high: 110
    hr_low: 55
    hr_high: 100
    temp_low: 35.0
    temp_high: 37.6
    water_low: 40
    water_high: 70
    weight_loss_pct: 5
  agitation:
    slot_hours: [8, 12, 18]  # TIHM's agitation model ran every ~6 h; windows end at these hours (night window 18:00 -> 08:00)
    baseline_slots: 14       # personal baseline = the same slot on the previous 14 days
    min_baseline_slots: 4
    history_days: 21
review:   # Review Coordinator (echos/team/review_coordinator.py); K and the fairness floor chosen from reports/metrics/v2_allocation.json
  k_per_day: 4              # clinician review slots per day for the whole caseload
  fairness_days: 7          # a patient not reviewed for >= 7 days is due ...
  fair_share: 0.5           # ... and due patients may take at most half of the slots
  watch_lift: 1.5           # not selected but >= 1.5x a base rate -> WATCH (dashboard only, no notification)
  wait_s: 20                # wait this long (wall clock) for every Patient Monitor's request before allocating with what has arrived ...
  max_wait_s: 300           # ... or up to this long while the agent being waited for is down (stale heartbeat, supervisor restarting it)
