seed: 42
paths:
  tihm: data/tihm/Dataset
  processed: data/processed/patient_day.parquet
  models: models
  metrics: reports/metrics
splits:
  n_folds: 5
night_hours: {start: 22, end: 6}
agent1:
  fixed_rule: {sys_high: 140, dia_high: 90, sys_low: 100}
  alert_budget_per_patient_week: [0.5, 1.0, 2.0]
  baseline_window_days: 28
agent2:
  baseline_window_days: 28
  min_baseline_days: 7
  cusum: {k: 0.5, h: 4.0}
  alert_budget_per_patient_week: [0.5, 1.0, 2.0]
data_quality:   # Agent 0 (rule-based), see docs/DATA_POLICY.md
  sensor_gap_frac: 0.05        # activity events < this fraction of the patient's PAST median -> SENSOR_GAP
  min_history_days: 3          # past good days needed before the median rule applies (zero events is always a gap)
  weights: {activity: 0.5, vitals: 0.4, validity: 0.1}   # completeness score
  ranges:                      # physiologically plausible limits (from reports/eda/DATA_QUALITY.md)
    Body Temperature: [34, 42]
    Skin Temperature: [20, 40]
    Systolic blood pressure: [60, 250]
    Diastolic blood pressure: [30, 150]
    Heart rate: [30, 220]
    Body weight: [30, 200]
    Total body water: [30, 80]
agent3:
  fs: 200
  window_s: 2.5
  stride_s: 1.25
  inactivity: {seconds: 3.0, std_g: 0.05}
  model_file: fall_v2.joblib   # v2 (unbiased windowing) model; fall.joblib = v1, kept
  jitter_s: 0.5            # v2 windowing: fall AND ADL peak windows are shifted by U(-jitter, +jitter) s around their own max sample
  n_folds: 5
  operating: {threshold: 0.8, require_inactivity: true}   # chosen by scripts/fall_audit.py (reports/metrics/fall_audit.json)
db_path: data/echos.db
checkpoint_db_path: data/langgraph_checkpoints.sqlite
runtime:
  heartbeat_s: 5
  checkpoint_s: 60
  poll_s: 0.2
  batch: 50
supervisor:
  missed_heartbeats: 3
  stall_s: 30        # last_event_id unchanged this long while events are pending -> dead
  poll_s: 1.0
replay:
  holdout_subjects: [SA03, SA11, SA19, SE06]   # fall model for replay is trained WITHOUT these subjects
  falls_per_patient: 3
  adl_windows_per_day: 2
health:   # Health Monitoring agent (vitals + behaviour sub-models)
  use_calibrated: true   # models/*_calibrated.joblib (scripts/calibrate.py); thresholds below are on the calibrated scale
  persistence: {z: 2.0, last_n: 3, need: 2}   # evidence only: 2 of last 3 readings beyond |z| >= 2 of the personal baseline
triage:
  # chosen from reports/metrics/{agent1,agent2,triage_thresholds}.json (see docs in orchestrator/triage.py)
  vitals_prob: 0.278       # calibrated OOF score: <= 1 alert / patient-week (scripts/choose_monitor_thresholds.py)
  agitation_prob: 0.129    # calibrated OOF score: the ONLY behaviour Monitor trigger; Monitor days <= 10% of patient-days
  drift_evidence_cusum: 10.4  # max per-feature CUSUM: report evidence only (routine_change fact), NOT a triage trigger
  fall_prob_high: null   # URGENT on probability alone; null = inactivity confirmation required (scripts/fall_audit.py)
  fall_prob: 0.8   # URGENT with post-fall inactivity (MONITOR without, if fall_prob_high is null); scripts/fall_audit.py
  critical_vitals: {sys_high: 180, sys_low: 85, dia_high: 120, hr_high: 130, hr_low: 40}
  max_vitals_gap_days: 7   # readings exist on ~62% of days; >7 days silent -> data_gap
llm:
  model: gemini-3.5-flash-lite
  fallback_model: gemini-3.5-flash         # Gemini model name, set by the user; null -> template mode (no LLM calls)
  temperature: 0.2
  retries: 1           # failed (non-timeout) LLM output is retried at most this many times, then Jinja2 template fallback
  timeout_s: 45        # hard per-call timeout; a timeout is never retried
  max_requests_per_min: 5   # legacy limiter, used only by the weekly report's direct generate() calls
  rpm: {primary: 15, fallback: 10}   # requests/min limits of the primary / fallback model (set from your Gemini quota); the budget manager stays 20% below
  cooldown_s: 60       # a model that returned HTTP 429 is skipped this long
  cache_path: data/llm_cache.sqlite   # response cache + call log (SQLite)
  max_pending: 200     # background report backlog; beyond it reports stay template (logged)
alerts:   # immediate alerts (fall, critical vitals): fixed template, no LLM; see echos/alerts/
  send_real: false          # false -> DryRunMailer: outbox rows only, SMTP is never used
  max_attempts: 3
  backoff_s: [1, 2, 4]      # weekly emails only: wait before the next attempt (a 3rd failure -> FAILED)
  retry_window_s: 900       # FALL / CRITICAL_VITALS emails: PENDING -> RETRYING with backoff 1, 2, 4, 8 ... capped at backoff_cap_s until this window (from queueing) ends -> FAILED
  backoff_cap_s: 60
  sweep_interval_s: 300     # a background sweeper retries FAILED alert rows this often ...
  sweep_window_s: 7200      # ... for this long after queueing (POST /api/outbox/{id}/retry resends one row on demand)
  critical_cooldown_sim_h: 12   # per patient: a second critical-vitals alert inside this many SIMULATED hours is suppressed
pubmed:   # live PubMed (NCBI E-utilities) for MONITOR / URGENT daily reports only; env: ECHOS_NCBI_EMAIL, optional NCBI_API_KEY
  enabled: true
  max_results: 3
  years: 15             # only publications of the last N years
  timeout_s: 10
  max_rps: 3            # NCBI limit without an API key
  cache_path: data/pubmed_cache.sqlite
weekly:   # weekly clinician report (PDF by email to the clinician only)
  enabled: true
  llm_narrative_in_simulation: false   # false: replays use the template Key findings (protects the Gemini quota); send-now may use the LLM
  dir: data/reports/weekly
  band_sd: 2.0          # personal band = past mean +/- band_sd * past sd
  max_pages: 3
  evidence:             # weekly 'Findings and supporting sources' (echos/reports/evidence.py)
    local_min_score: 0.5     # local guideline chunks below this cosine similarity are dropped (the daily report keeps rag.min_score 0.25)
    max_sources_per_finding: 2   # local first, at most 1 PubMed
    max_pubmed_per_finding: 1
report_gate:
  enabled: true       # NORMAL days get a template daily report (no LLM, no RAG); never affects triage or alerts
rag:
  enabled: true                       # false -> reports have no guideline guidance (template mode still works)
  embedding_model: all-MiniLM-L6-v2   # local sentence-transformers model, no API key
  dir: data/rag                       # persistent Chroma store (git-ignored)
  k: 3
  min_score: 0.25                     # cosine similarity below this is treated as not relevant
reports:
  daily_dir: reports/daily
  weekly_dir: reports/weekly
  samples_dir: reports/samples
api:   # echos/api (FastAPI): bound to 127.0.0.1, NO authentication (demo only), CORS for the local UI only
  host: 127.0.0.1
  port: 8000
  cors_origin: http://localhost:5173
  allow_kill: false      # POST /api/agents/{name}/kill is refused unless true

coordinator:   # Care Coordinator agent (echos/team/coordinator.py): owns the alert lifecycle. Wall-clock seconds.
  poll_s: 1.0
  ack_timeout_s: {FALL: 300, CRITICAL_VITALS: 1800}   # not acknowledged this long after SENT -> ESCALATED (second contact)
  checkin_after_ack_s: 1800                            # after an acknowledged FALL: open a "confirm the person is well" task due this long later
  review_window_days: 5                                # >= review_min_days non-NORMAL days within this window -> a clinician-review task
  review_min_days: 3
investigator:   # Case Investigator agent (echos/team/investigator.py): bounded tool loop, no LLM
  max_steps: 4

live:   # live / emulator mode (echos/live). Raw events -> ingestion API -> event_log -> LiveProcessor (detectors scored from events, rolling triage).
  decide_min_interval_s: 2.0     # activity-only batches re-decide at most this often (vitals and accelerometer events decide at once)
  silent_hours: 6                # no activity event for this many DATA hours inside day_window while the patient's other streams advance -> sensor silent (provisional gap)
  day_window: [7, 22]
  offline_after_s: 120           # wall seconds without any event -> the stream shows as stale in the UI (real and emulated sources alike)
  emulator:                      # a LABELLED emulator: replays real TIHM raw events in wall-clock time. Not a real device.
    speed: 3600                  # simulated seconds per wall second (3600 = one data hour per second, one day in 24 s)
    heartbeat_min: 15            # simulated minutes between device heartbeats
    start_day: "2019-05-13"
    n_days: 14
    n_patients: 4
